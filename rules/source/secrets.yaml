rules:
  - id: source.secrets.hardcoded-credential
    languages: [generic]
    severity: ERROR
    message: Possible hardcoded credential. Inspect and rotate it if it is real.
    metadata:
      category: committed-secrets
      confidence: medium
    pattern-regex: (?i)(?:api[_-]?key|client[_-]?secret|password|access[_-]?token)\s*[:=]\s*["'][^"'\s]{12,}["']

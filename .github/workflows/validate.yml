name: KB validation

# Enforces the HC-KB-01 validation gate on every change (HC-KB-01 §9, §12).
# Pure standard library, no dependency install step.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
      - name: Validate materialized cards (HC-KB-01 §9, strict)
        run: python3 tools/validate_kb.py --strict
      - name: kb/ tree is in sync with the specs
        run: |
          python3 tools/materialize_kb.py
          if [ -n "$(git status --porcelain -- kb eval)" ]; then
            echo "::error::kb/ tree is out of sync with the specs; run 'make materialize' and commit."
            git status --porcelain -- kb eval
            exit 1
          fi
      - name: Validator self-tests (HC-KB-01 §12)
        run: python3 tests/test_validator.py
      - name: Substrate self-tests (HC-SUB-01 §4-§7, §12)
        run: python3 tests/test_substrate.py
      - name: Store self-tests (HC-DATA-01, HC-SAFE-01 invariants)
        run: python3 tests/test_store.py
      - name: Dispatch chokepoint self-tests (HC-AGENT-01 §5.2, §11)
        run: python3 tests/test_dispatch.py
      - name: Finding/report self-tests (HC-FIND-01 §5, §7, §9)
        run: python3 tests/test_findings_report.py
      - name: Control-loop self-tests (HC-AGENT-01 §4, §11)
        run: python3 tests/test_loop.py
      - name: Planner self-tests (HC-AGENT-01 §3)
        run: python3 tests/test_planner.py
      - name: Role I/O boundary self-tests (HC-AGENT-01 §5.1, §7, §9)
        run: python3 tests/test_roleio.py
      - name: Model-plane self-tests (HC-MODEL-01 §13)
        run: python3 tests/test_modelplane.py
      - name: Example engagement contract parses
        run: python3 -m harness.substrate.contract harness/substrate/examples/engagement.example.yaml
      - name: Business-requirement features are valid and in sync
        run: |
          python3 tools/gen_features.py
          if [ -n "$(git status --porcelain -- docs/requirements/features)" ]; then
            echo "::error::docs/requirements/features is out of sync; run 'make features' and commit."
            git status --porcelain -- docs/requirements/features
            exit 1
          fi

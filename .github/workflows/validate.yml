name: KB validation

# Enforces the HC-KB-01 validation gate on every change (HC-KB-01 §9, §12).
# Pure standard library, no dependency install step.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
      - name: Validate technique cards (HC-KB-01 §9)
        # Non-strict: UNRESOLVED taxonomy ids are tracked, not fatal, until the
        # full upstream catalogs are bundled. Switch to --strict after that.
        run: python3 tools/validate_kb.py
      - name: Validator self-tests (HC-KB-01 §12)
        run: python3 tests/test_validator.py

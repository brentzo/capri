severity_rubric: { base: medium, raise_if: [ { when: "yields.client_exec", to: high } ], cvss_base_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:L/VA:N/SC:N/SI:N/SA:N" }
test_fixture: { fires_on: seed/client-side/kb-client-dom-clobber-001-vuln, does_not_fire: seed/client-side/kb-client-dom-clobber-001-patched }
references: [ "https://cwe.mitre.org/data/definitions/79.html", "https://owasp.org/www-project-web-security-testing-guide/" ]

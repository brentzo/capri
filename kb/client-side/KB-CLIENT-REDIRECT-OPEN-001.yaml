id: KB-CLIENT-REDIRECT-OPEN-001
title: Open redirect via an unvalidated redirect parameter
version: 1.0.0
status: active
supersedes: null
taxonomy: { owasp: [WSTG-CLNT-04], cwe: [CWE-601] }
applicability: [ 'asset.type == "http_endpoint"', 'matches(asset.params, /url|next|dest|return|redirect/)' ]
preconditions: [ reachable ]
yields_on_success: [ open_redirect ]
inputs: { param: "{asset.params[*]}" }
blast_tier: 1
cleanup: none
probe_steps:
  - { tool: httpx, intent: redirect_to_foreign_origin, args: { value: "https://evil.range.local" } }
success_signal: { type: status_match, evaluator: deterministic, assert: "a 3xx Location or a client-side redirect points to the attacker-controlled origin", confidence_floor: 0.0 }
severity_rubric: { base: medium, raise_if: [ { when: "yields.token_exposure", to: high } ], cvss_base_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:L/VA:N/SC:N/SI:N/SA:N" }
false_positive_notes: [ "A redirect confined to the same origin or an allowlist is not open; require the foreign origin to be honored." ]
test_fixture: { fires_on: seed/client-side/kb-client-redirect-open-001-vuln, does_not_fire: seed/client-side/kb-client-redirect-open-001-patched }
references: [ "https://cwe.mitre.org/data/definitions/601.html", "https://owasp.org/www-project-web-security-testing-guide/" ]

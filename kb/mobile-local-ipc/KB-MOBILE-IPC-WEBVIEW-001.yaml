severity_rubric: { base: high, cvss_base_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N" }
test_fixture: { fires_on: seed/mobile-local-ipc/kb-mobile-ipc-webview-001-vuln, does_not_fire: seed/mobile-local-ipc/kb-mobile-ipc-webview-001-patched }
references: [ "https://cwe.mitre.org/data/definitions/749.html", "https://owasp.org/www-project-mobile-top-10/" ]

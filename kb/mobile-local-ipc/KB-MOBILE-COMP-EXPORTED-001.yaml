id: KB-MOBILE-COMP-EXPORTED-001
title: Exported component invokable by an unauthorized caller
version: 1.0.0
status: active
supersedes: null
taxonomy: { owasp: [M8:2024], cwe: [CWE-926, CWE-862] }
applicability: [ 'asset.type == "mobile_app"', 'exists(asset.exported_components)' ]
preconditions: [ reachable, mobile_app, exported_component ]
yields_on_success: [ component_abuse ]
blast_tier: 2
cleanup: snapshot-restore
probe_steps:
  - { tool: custom.mobile_probe, intent: invoke_exported_component, args: { marker: exported_canary } }
success_signal: { type: state_change, evaluator: deterministic, assert: "an unauthorized caller drives the component to set exported_canary", confidence_floor: 0.0 }
severity_rubric: { base: high, cvss_base_vector: "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N" }
test_fixture: { fires_on: seed/mobile-local-ipc/kb-mobile-comp-exported-001-vuln, does_not_fire: seed/mobile-local-ipc/kb-mobile-comp-exported-001-patched }
references: [ "https://cwe.mitre.org/data/definitions/926.html", "https://cwe.mitre.org/data/definitions/862.html", "https://owasp.org/www-project-mobile-top-10/" ]

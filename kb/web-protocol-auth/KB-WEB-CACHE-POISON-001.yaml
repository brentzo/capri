id: KB-WEB-CACHE-POISON-001
title: Web cache poisoning via unkeyed input
version: 1.0.0
status: active
supersedes: null
taxonomy: { cwe: [CWE-444] }
applicability: [ 'asset.cacheable == true' ]
preconditions: [ reachable, cacheable_endpoint ]
yields_on_success: [ cache_control ]
blast_tier: 2
cleanup: snapshot-restore
probe_steps:
  - { tool: custom.cache_probe, intent: unkeyed_header_inject }
  - { tool: custom.cache_probe, intent: confirm_served_from_cache }
success_signal: { type: response_diff, evaluator: deterministic, assert: "injected payload served to a second, clean request from cache", confidence_floor: 0.0 }
severity_rubric: { base: high, cvss_base_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N" }
test_fixture: { fires_on: seed/web-protocol-auth/kb-web-cache-poison-001-vuln, does_not_fire: seed/web-protocol-auth/kb-web-cache-poison-001-patched }
references: [ "https://cwe.mitre.org/data/definitions/444.html" ]

id: KB-WEB-INJ-SQLI-001
title: Error/boolean-based SQL injection in a query parameter
version: 1.0.0
status: active
supersedes: null
taxonomy: { attack: {technique: T1190}, owasp: [WSTG-INPV-05], cwe: [CWE-89] }
applicability: [ 'asset.type == "http_endpoint"', 'exists(asset.params)' ]
preconditions: [ reachable ]
yields_on_success: [ db_read ]
inputs: { param: "{asset.params[*]}" }
blast_tier: 1
cleanup: none
probe_steps:
  - { tool: httpx,             intent: baseline }
  - { tool: custom.sqli_probe, intent: error_and_boolean }
success_signal: { type: response_diff, evaluator: deterministic, assert: "db_error_fingerprint(resp) OR boolean_oracle_divergence(baseline, resp)", confidence_floor: 0.0 }
severity_rubric: { base: high, raise_if: [ { when: "yields.writable", to: critical } ], cvss_base_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N" }
test_fixture: { fires_on: seed/web-protocol-auth/kb-web-inj-sqli-001-vuln, does_not_fire: seed/web-protocol-auth/kb-web-inj-sqli-001-patched }
references: [ "https://cwe.mitre.org/data/definitions/89.html", "https://attack.mitre.org/techniques/T1190/", "https://owasp.org/www-project-web-security-testing-guide/" ]

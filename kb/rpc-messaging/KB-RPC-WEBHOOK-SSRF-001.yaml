id: KB-RPC-WEBHOOK-SSRF-001
title: Webhook callback URL drives server-side request forgery
version: 1.0.0
status: active
supersedes: null
taxonomy: { attack: {technique: T1190}, cwe: [CWE-918] }
applicability: [ 'asset.type == "rpc_endpoint"', 'asset.accepts_callback_url == true' ]
preconditions: [ reachable, rpc_endpoint ]
yields_on_success: [ internal_reach ]
blast_tier: 1
cleanup: none
probe_steps:
  - { tool: custom.rpc_probe, intent: register_callback, args: { url: range-oob } }
success_signal: { type: oob_callback, evaluator: deterministic, assert: "oob_received(collaborator=range-oob, from=target)", confidence_floor: 0.0 }
severity_rubric: { base: high, raise_if: [ { when: "yields.cloud_credential", to: critical } ], cvss_base_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N" }
test_fixture: { fires_on: seed/rpc-messaging/kb-rpc-webhook-ssrf-001-vuln, does_not_fire: seed/rpc-messaging/kb-rpc-webhook-ssrf-001-patched }
references: [ "https://cwe.mitre.org/data/definitions/918.html", "https://attack.mitre.org/techniques/T1190/" ]

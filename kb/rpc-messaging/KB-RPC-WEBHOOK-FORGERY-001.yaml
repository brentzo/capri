id: KB-RPC-WEBHOOK-FORGERY-001
title: Webhook receiver accepts unsigned or forged events
version: 1.0.0
status: active
supersedes: null
taxonomy: { attack: {technique: T1190}, cwe: [CWE-345] }
applicability: [ 'asset.type == "rpc_endpoint"', 'asset.is_webhook_receiver == true' ]
preconditions: [ reachable ]
yields_on_success: [ forged_event ]
blast_tier: 2
cleanup: snapshot-restore
probe_steps:
  - { tool: custom.rpc_probe, intent: deliver_forged_event, args: { marker: forged_canary } }
success_signal: { type: state_change, evaluator: deterministic, assert: "an event with no valid signature is processed and produces forged_canary state", confidence_floor: 0.0 }
severity_rubric: { base: high, cvss_base_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N" }
test_fixture: { fires_on: seed/rpc-messaging/kb-rpc-webhook-forgery-001-vuln, does_not_fire: seed/rpc-messaging/kb-rpc-webhook-forgery-001-patched }
references: [ "https://cwe.mitre.org/data/definitions/345.html", "https://attack.mitre.org/techniques/T1190/" ]

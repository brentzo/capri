success_signal: { type: content_match, evaluator: deterministic, assert: "response_contains(range_canary_marker)", confidence_floor: 0.0 }
severity_rubric: { base: high, raise_if: [ { when: "yields.internal_reach", to: critical } ], cvss_base_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N" }
test_fixture: { fires_on: seed/rpc-messaging/kb-rpc-serial-xxe-001-vuln, does_not_fire: seed/rpc-messaging/kb-rpc-serial-xxe-001-patched }
references: [ "https://cwe.mitre.org/data/definitions/611.html", "https://owasp.org/www-project-web-security-testing-guide/" ]

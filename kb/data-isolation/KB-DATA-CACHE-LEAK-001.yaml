id: KB-DATA-CACHE-LEAK-001
title: Shared cache serves another tenant's data
version: 1.0.0
status: active
supersedes: null
taxonomy: { cwe: [CWE-524, CWE-488] }
applicability: [ 'asset.type == "http_endpoint"', 'asset.multi_tenant == true', 'asset.cacheable == true' ]
preconditions: [ reachable, multi_tenant ]
yields_on_success: [ cross_object_read ]
blast_tier: 1
cleanup: none
probe_steps:
  - { tool: custom.data_probe, intent: warm_cache_as_tenant_b }
  - { tool: custom.data_probe, intent: read_same_key_as_tenant_a, args: { canary: tenant_b_canary } }
success_signal: { type: differential, evaluator: deterministic, assert: "tenant A is served tenant_b_canary from cache because the key omits the tenant", confidence_floor: 0.0 }
severity_rubric: { base: high, cvss_base_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N" }
test_fixture: { fires_on: seed/data-isolation/kb-data-cache-leak-001-vuln, does_not_fire: seed/data-isolation/kb-data-cache-leak-001-patched }
references: [ "https://cwe.mitre.org/data/definitions/524.html", "https://cwe.mitre.org/data/definitions/488.html" ]

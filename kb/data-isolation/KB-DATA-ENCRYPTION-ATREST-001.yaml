severity_rubric: { base: high, cvss_base_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N" }
test_fixture: { fires_on: seed/data-isolation/kb-data-encryption-atrest-001-vuln, does_not_fire: seed/data-isolation/kb-data-encryption-atrest-001-patched }
references: [ "https://cwe.mitre.org/data/definitions/311.html", "https://attack.mitre.org/techniques/T1530/" ]

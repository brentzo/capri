test_fixture: { fires_on: seed/cloud-deployment/kb-cloud-storage-read-001-vuln, does_not_fire: seed/cloud-deployment/kb-cloud-storage-read-001-patched }
references: [ "https://cwe.mitre.org/data/definitions/284.html", "https://cwe.mitre.org/data/definitions/200.html", "https://attack.mitre.org/techniques/T1530/" ]

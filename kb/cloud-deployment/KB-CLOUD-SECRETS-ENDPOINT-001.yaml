severity_rubric: { base: high, cvss_base_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N" }
test_fixture: { fires_on: seed/cloud-deployment/kb-cloud-secrets-endpoint-001-vuln, does_not_fire: seed/cloud-deployment/kb-cloud-secrets-endpoint-001-patched }
references: [ "https://cwe.mitre.org/data/definitions/200.html", "https://cwe.mitre.org/data/definitions/306.html" ]

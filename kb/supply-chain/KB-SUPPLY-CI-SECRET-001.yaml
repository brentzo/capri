id: KB-SUPPLY-CI-SECRET-001
title: CI secret exposed to a build step or log
version: 1.0.0
status: active
supersedes: null
taxonomy: { cwe: [CWE-532, CWE-200] }
applicability: [ 'asset.type == "ci_pipeline"' ]
preconditions: [ reachable, build_pipeline ]
yields_on_success: [ ci_secret ]
blast_tier: 1
cleanup: none
probe_steps:
  - { tool: custom.supply_probe, intent: read_reachable_build_log }
success_signal: { type: content_match, evaluator: deterministic, assert: "a build log or artifact exposes the ci_secret_canary", confidence_floor: 0.0 }
severity_rubric: { base: high, cvss_base_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N" }
test_fixture: { fires_on: seed/supply-chain/kb-supply-ci-secret-001-vuln, does_not_fire: seed/supply-chain/kb-supply-ci-secret-001-patched }
references: [ "https://cwe.mitre.org/data/definitions/532.html", "https://cwe.mitre.org/data/definitions/200.html" ]

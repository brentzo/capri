success_signal: { type: oob_callback, evaluator: deterministic, assert: "oob_received(collaborator=range-oob, from=install)", confidence_floor: 0.0 }
severity_rubric: { base: high, cvss_base_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N" }
test_fixture: { fires_on: seed/supply-chain/kb-supply-postinstall-001-vuln, does_not_fire: seed/supply-chain/kb-supply-postinstall-001-patched }
references: [ "https://cwe.mitre.org/data/definitions/94.html", "https://attack.mitre.org/techniques/T1195/001/" ]

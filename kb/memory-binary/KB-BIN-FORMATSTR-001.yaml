false_positive_notes: [ "The probe uses read specifiers only; a %n write path would be a separate, higher-tier card." ]
test_fixture: { fires_on: seed/memory-binary/kb-bin-formatstr-001-vuln, does_not_fire: seed/memory-binary/kb-bin-formatstr-001-patched }

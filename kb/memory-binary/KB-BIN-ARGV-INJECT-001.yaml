severity_rubric: { base: critical, cvss_base_vector: "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N" }
test_fixture: { fires_on: seed/memory-binary/kb-bin-argv-inject-001-vuln, does_not_fire: seed/memory-binary/kb-bin-argv-inject-001-patched }
references: [ "https://cwe.mitre.org/data/definitions/88.html", "https://attack.mitre.org/techniques/T1059/" ]
